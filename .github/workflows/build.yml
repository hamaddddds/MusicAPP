name: Release
on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Auto version (1.5.<run_number>) so releases/updater bump automatically
        id: version
        shell: bash
        run: |
          VER="1.5.${{ github.run_number }}"
          node -e "const f='Frontend/package.json';const j=require('./'+f);j.version='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const f='Frontend/src-tauri/tauri.conf.json';const j=require('./'+f);j.version='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "Building version $VER"
          echo "VER=$VER" >> "$GITHUB_OUTPUT"
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: install frontend dependencies
        run: cd Frontend && npm install
      - name: Generate Changelog
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const commits = event.commits || [];
            let added = [], removed = [], fixed = [], improved = [];
            commits.forEach(c => {
              const lines = c.message.split('\n');
              const firstLine = lines[0];
              const msg = firstLine.toLowerCase();
              let desc = firstLine.replace(/^(feat|fix|chore|refactor|perf|style|docs)(\([a-z-]+\))?:\s*/i, '');
              // Capitalize first letter
              desc = desc.charAt(0).toUpperCase() + desc.slice(1);
              if (msg.startsWith('feat') || msg.startsWith('add')) added.push(desc);
              else if (msg.startsWith('remove') || msg.startsWith('delete') || msg.startsWith('drop')) removed.push(desc);
              else if (msg.startsWith('fix') || msg.startsWith('bug')) fixed.push(desc);
              else improved.push(desc);
            });
            let out = '';
            if (added.length) out += '[+] Added\n' + added.map(x => '- ' + x).join('\n') + '\n';
            if (removed.length) out += '[-] Remove\n' + removed.map(x => '- ' + x).join('\n') + '\n';
            if (fixed.length) out += '[~] Fixing\n' + fixed.map(x => '- ' + x).join('\n') + '\n';
            if (improved.length) out += '[*] Improvement\n' + improved.map(x => '- ' + x).join('\n') + '\n';
            if (!out.trim()) out = '[*] Improvement\n- Minor under the hood improvements and optimizations.';
            fs.writeFileSync('changelog.txt', out.trim());
          "
          {
            echo "CHANGELOG<<EOF"
            cat changelog.txt
            echo ""
            echo "EOF"
          } >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Music Venue v__VERSION__ (beta)"
          releaseBody: ${{ env.CHANGELOG }}
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          projectPath: ./Frontend
      - name: Clean up release assets (keep installer exe + latest.json, drop sigs)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.version.outputs.VER }}
        run: |
          TAG="app-v${VER}"
          # Keep latest.json (the updater reads the embedded signature from it)
          # and the installer .exe. Delete msi, standalone .sig files, and the
          # separate latest.json.sig — the signature is already inside latest.json.
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r f; do
            case "$f" in
              *.msi|*.msi.sig|*.exe.sig|latest.json.sig)
                echo "deleting asset: $f"
                gh release delete-asset "$TAG" "$f" --yes || true
                ;;
            esac
          done
          # Rename the NSIS installer to "Music Venue (version).exe" and patch
          # latest.json so the updater still points at the new file name.
          NEW="Music Venue (${VER}).exe"
          OLD=$(gh release view "$TAG" --json assets -q '.assets[].name' | grep -i "setup\.exe$" | head -n1)
          if [ -n "$OLD" ] && [ "$OLD" != "$NEW" ]; then
            gh release download "$TAG" -p "$OLD" -R "$GITHUB_REPOSITORY" --dir /tmp/rel
            gh release download "$TAG" -p "latest.json" -R "$GITHUB_REPOSITORY" --dir /tmp/rel || true
            gh release delete-asset "$TAG" "$OLD" --yes || true
            # gh upload uses the local file's basename as the asset name, so
            # copy to the desired name before uploading.
            mv "/tmp/rel/$OLD" "/tmp/rel/$NEW"
            gh release upload "$TAG" "/tmp/rel/$NEW" --clobber
            # Patch latest.json: replace the old installer URL with the new name.
            if [ -f /tmp/rel/latest.json ]; then
              sed -i "s|$OLD|$NEW|g" /tmp/rel/latest.json
              gh release upload "$TAG" "/tmp/rel/latest.json" --clobber || true
            fi
          fi
