name: Release
on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Auto version (1.5.<run_number>) so releases/updater bump automatically
        id: version
        shell: bash
        run: |
          VER="1.5.${{ github.run_number }}"
          node -e "const f='Frontend/package.json';const j=require('./'+f);j.version='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          node -e "const f='Frontend/src-tauri/tauri.conf.json';const j=require('./'+f);j.version='$VER';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
          echo "Building version $VER"
          echo "VER=$VER" >> "$GITHUB_OUTPUT"
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: install frontend dependencies
        run: cd Frontend && npm install
      - name: Generate Changelog
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            const commits = event.commits || [];
            let added = [], removed = [], fixed = [], improved = [];
            commits.forEach(c => {
              const lines = c.message.split('\n');
              const firstLine = lines[0];
              const msg = firstLine.toLowerCase();
              let desc = firstLine.replace(/^(feat|fix|chore|refactor|perf|style|docs)(\([a-z-]+\))?:\s*/i, '');
              // Capitalize first letter
              desc = desc.charAt(0).toUpperCase() + desc.slice(1);
              if (msg.startsWith('feat') || msg.startsWith('add')) added.push(desc);
              else if (msg.startsWith('remove') || msg.startsWith('delete') || msg.startsWith('drop')) removed.push(desc);
              else if (msg.startsWith('fix') || msg.startsWith('bug')) fixed.push(desc);
              else improved.push(desc);
            });
            let out = '';
            if (added.length) out += '[+] Added\n' + added.map(x => '- ' + x).join('\n') + '\n';
            if (removed.length) out += '[-] Remove\n' + removed.map(x => '- ' + x).join('\n') + '\n';
            if (fixed.length) out += '[~] Fixing\n' + fixed.map(x => '- ' + x).join('\n') + '\n';
            if (improved.length) out += '[*] Improvement\n' + improved.map(x => '- ' + x).join('\n') + '\n';
            if (!out.trim()) out = '[*] Improvement\n- Minor under the hood improvements and optimizations.';
            fs.writeFileSync('changelog.txt', out.trim());
          "
          {
            echo "CHANGELOG<<EOF"
            cat changelog.txt
            echo ""
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: build python backend
        shell: bash
        run: |
          cd Backend
          pip install pyinstaller
          pip install -r requirements.txt
          python -m PyInstaller --onefile --noconsole --name backend-x86_64-pc-windows-msvc --hidden-import uvicorn.logging --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on --hidden-import uvicorn.lifespan.off --hidden-import ytmusicapi --hidden-import yt_dlp --hidden-import fastapi --hidden-import starlette --hidden-import pydantic --hidden-import app run.py
          mkdir -p ../Frontend/src-tauri/binaries/
          cp dist/backend-x86_64-pc-windows-msvc.exe ../Frontend/src-tauri/binaries/
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Music Venue v__VERSION__ (beta)"
          releaseBody: ${{ env.CHANGELOG }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          projectPath: ./Frontend
      - name: Clean up release assets (keep updater files intact, drop msi only)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.version.outputs.VER }}
        run: |
          TAG="app-v${VER}"
          # Delete old v0.2.x releases so they no longer appear on the release
          # page / don't shadow the new 1.5.x as "Latest".
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft -q '.[] | select(.isDraft == false) | .tagName' | while read -r t; do
            case "$t" in
              app-v0.2.*)
                echo "deleting old release: $t"
                gh release delete "$t" --yes --cleanup-tag || true
                ;;
            esac
          done
          # IMPORTANT: keep latest.json, the installer .exe, and its .exe.sig
          # exactly as Tauri uploaded them. The updater verifies the payload
          # against the .sig sibling of the download URL — renaming or deleting
          # those breaks in-app updates.
          # Only drop the MSI artifacts (we build NSIS only).
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r f; do
            case "$f" in
              *.msi|*.msi.sig)
                echo "deleting asset: $f"
                gh release delete-asset "$TAG" "$f" --yes || true
                ;;
            esac
          done
